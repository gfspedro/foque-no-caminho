<style id="mm-style">
/* Princípio: o mínimo de design possível. Fonte do sistema, tons de cinza neutros, nenhuma caixa, nenhuma cor.
   A estrutura é a árvore comum (como a de pastas do sistema) pendurada numa linha do tempo simples.
   Tema escuro por padrão; o botão de tema troca para o claro (escolha guardada só neste navegador). */
:root{
  --bg:#151515; --ink:#EDEDED; --ink-2:#C7C7CA; --muted:#8E8E93; --faint:#4A4A4D;
  --line:#3A3A3C; --rail:#606064; --dot:#A1A1A6; --btn:#1F1F21; --shade:rgba(0,0,0,.45);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-mm-theme="light"]{
  --bg:#FAFAF9; --ink:#1D1D1F; --ink-2:#3A3A3C; --muted:#86868B; --faint:#C7C7CC;
  --line:#D4D4D8; --rail:#AEAEB2; --dot:#6E6E73; --btn:#FFFFFF; --shade:rgba(0,0,0,.12);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
#mm-root{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
button{font:inherit;color:inherit}

/* ---------- cabeçalho ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);border-bottom:1px solid var(--line)}
h1{margin:0;min-width:0;font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em;outline:none;border-radius:4px}
.editing h1{cursor:text;text-decoration:underline dotted var(--rail);text-underline-offset:5px}
h1[contenteditable]{text-decoration:none;box-shadow:0 0 0 1px var(--rail);padding:0 4px;margin:0 -4px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--rail)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.pctl button:focus-visible,.node:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ic{width:32px;padding:0;font-size:16px;line-height:1}
.btn.primary,.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--btn)}
.btn.primary:hover,.btn[aria-pressed="true"]:hover{background:var(--ink-2);border-color:var(--ink-2)}
.grp-b{display:inline-flex;align-items:center;gap:6px}
.keys{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:719px){ h1{font-size:17px} .keys{display:none} }

/* ---------- mapa ---------- */
main{position:relative;overflow:hidden;min-height:0}
.vp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
.vp.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires .w{fill:none;stroke:var(--line);stroke-width:1;stroke-linecap:round}
#wires .rail{fill:none;stroke:var(--rail);stroke-width:1.25}
.mk circle{fill:var(--dot);transition:fill .35s}
.mk text{font-family:var(--f);font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums;transition:fill .35s}

.node{position:absolute;left:0;top:0;width:max-content;margin:0;border:0;background:none;text-align:left;cursor:default;
  font-family:var(--f);color:var(--ink-2);transition:color .35s}
.node.grp{cursor:pointer}
.n1{max-width:200px;padding:2px 0;font-size:16px;line-height:21px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.n2{max-width:212px;padding:3px 0;font-size:13.5px;line-height:19px}
.n3{max-width:196px;padding:3px 0;font-size:13px;line-height:18px}
.n2.grp,.n3.grp{font-weight:500;color:var(--ink)}
body:not(.presenting):not(.editing) .node.grp:hover{color:var(--ink)}
body:not(.presenting):not(.editing) .node.grp:hover .lab{text-decoration:underline;text-decoration-color:var(--rail);text-underline-offset:3px}
.cnt{margin-left:6px;font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt:empty{display:none}

/* ---------- edição ---------- */
.editing .node{cursor:text}
.editing .node .lab{text-decoration:underline dotted var(--rail);text-decoration-thickness:1px;text-underline-offset:4px}
.editing .node.changed .lab{text-decoration-style:solid;text-decoration-color:var(--ink-2)}
.node.is-editing{visibility:hidden}
.ed{position:absolute;left:0;top:0;margin:0;padding:2px 5px;border:1px solid var(--rail);border-radius:4px;background:var(--bg);color:var(--ink);
  font-family:var(--f);resize:none;overflow:hidden;outline:none;z-index:5;box-shadow:0 8px 24px var(--shade)}

.ed.d2{font-size:13.5px;line-height:19px}
.ed.d3{font-size:13px;line-height:18px}

.bar .msg{min-width:0}
.bar .msg a{color:var(--ink);text-underline-offset:3px}
.bar .acts{display:flex;gap:6px}
.bar .acts:empty{display:none}

/* ---------- apresentação: foco só por contraste ---------- */
body.presenting #mm-root{grid-template-rows:minmax(0,1fr)}
.presenting .top,.presenting .bar{display:none}
.presenting .vp{cursor:default}
.presenting .node:focus-visible{outline:none}
#stage.dimming .node{color:var(--faint)}
#stage.dimming .node.ctx{color:var(--ink-2)}
#stage.dimming .node.focus{color:var(--ink)}
#stage.dimming .mk circle{fill:var(--faint)}
#stage.dimming .mk text{fill:var(--faint)}
#stage.dimming .mk.focus circle{fill:var(--ink)}
#stage.dimming .mk.focus text{fill:var(--ink)}
.pctl{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  align-items:center;gap:6px;padding:6px;border-radius:8px;background:var(--btn);border:1px solid var(--line);transition:opacity .3s}
.presenting .pctl{display:flex}
.presenting.idle .pctl{opacity:0;pointer-events:none}
.presenting.idle,.presenting.idle *{cursor:none !important}
.pctl button{height:30px;min-width:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;font-size:13px}
.pctl span{font-size:12px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.node,.mk circle,.mk text,.pctl{transition:none}}

/* ---------- arrastar, pinça e rolagem (fora da apresentação) ---------- */

  document.body.classList.add("presenting");
  measure(); layout(); vt = fitTarget(); snap();
  P.steps = ["all"].concat(items, ["all"]);
  try {
    var el = document.documentElement, r = el.requestFullscreen ? el.requestFullscreen() : null;
    if (r && r.catch) r.catch(function(){});
  } catch(_e){}
  go(0, true);
  wake();
}
function exitPresent(){
  if (!P.on) return;
  P.on = false;
  if (P.anim){ cancelAnimationFrame(P.anim); P.anim = 0; }
  clearTimeout(P.idleT);
  document.body.classList.remove("presenting", "idle");
  stage.classList.remove("dimming");
  clearFocus();
  expanded = P.saved || expanded;
  updateCounts(); measure(); layout(); vt = fitTarget(); userMoved = false; snap();
  if (document.fullscreenElement && document.exitFullscreen){ try { document.exitFullscreen().catch(function(){}); } catch(_e){} }
  $("#bPres").focus();
}
$("#bPres").addEventListener("click", enterPresent);
$("#cPrev").addEventListener("click", function(e){ e.currentTarget.blur(); go(P.i - 1); });
$("#cNext").addEventListener("click", function(e){ e.currentTarget.blur(); go(P.i + 1); });
$("#cExit").addEventListener("click", exitPresent);
document.addEventListener("keydown", function(e){
  if (!P.on) return;
  var k = e.key;
  if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Spacebar" || k === "Enter"){ e.preventDefault(); go(P.i + 1); }
  else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace"){ e.preventDefault(); go(P.i - 1); }
  else if (k === "Home"){ e.preventDefault(); go(0); }
  else if (k === "End"){ e.preventDefault(); go(P.steps.length - 1); }
  else if (k === "Escape"){ e.preventDefault(); exitPresent(); }
}, true);
vp.addEventListener("click", function(e){
  if (!P.on || e.target.closest(".node")) return;
  var r = vp.getBoundingClientRect();
  if (e.clientX - r.left < r.width / 3) go(P.i - 1); else go(P.i + 1);
});
document.addEventListener("pointermove", function(){ if (P.on) wake(); });
document.addEventListener("pointerdown", function(){ if (P.on) wake(); });
document.addEventListener("fullscreenchange", function(){
  if (document.fullscreenElement) P.fs = true;
  else if (P.fs){ P.fs = false; if (P.on) exitPresent(); }
});

/* ---------- início ---------- */
updateCounts();
measure(); layout(); vt = fitTarget(); snap();
var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
fontsReady.then(function(){
  measure(); layout();
  if (P.on){ snap(); go(P.i, true); }
  else { if (!userMoved) vt = fitTarget(); snap(); }
});
var rt = 0;
addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    if (P.on) go(P.i, true);
    else if (!userMoved){ vt = fitTarget(); snap(); }
  }, 120);
});
})();
</script>
